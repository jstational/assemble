name: "Desktop Build"

on:
  push:
    branches:
      ["main"]

jobs:
  build:
    name: "Desktop Build"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
      
      - name: "Install JDK"
        uses: "actions/setup-java@v6"
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Setup gradle"
        uses: "gradle/actions/setup-gradle@v6"
            
      - name: "Build"
        run: |
          chmod +x ./gradlew
          ./gradlew deploy

      - name: "Deploy"
        uses: "actions/upload-artifact@v7"
        with: 
          name: "assemble"
          path: "build/libs/*.jar"